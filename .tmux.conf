# reload zsh and tmux config files
bind r run-shell "tmux source-file ~/.tmux.conf"

# rebind prefix key
# set-option -g prefix C-M-B
# unbind-key C-b
# bind-key C-M-B send-prefix

# enable extended key sequences
set-option -g extended-keys
set-option -g terminal-features 'xterm*:extkeys'
set-option -g extended-keys-format csi-u

setw -g aggressive-resize on

# renumber remaining windows when one closes, so there are no gaps
set -g renumber-windows on

# create and close windows with Ctrl-Shift-n and Ctrl-Shift-w respectively
bind -n C-N new-window
bind -n C-W kill-window
bind -n M-n new-window
bind -n M-w confirm-before -p "kill-window #W? (y/n)" kill-window

# switch window with Shift-<hl>
bind -n C-M-S-Left prev
bind -n C-M-S-Right next

bind -n C-M-H prev
bind -n C-M-L next

bind -n M-[ prev
bind -n M-] next

# resize panes with Alt-Shift-<arrowkey> and Alt-Shift-<hjkl>
bind -n M-S-Left resize-pane -L 2
bind -n M-S-Right resize-pane -R 2
bind -n M-S-Up resize-pane -U 2
bind -n M-S-Down resize-pane -D 2

bind -n M-H resize-pane -L 2
bind -n M-L resize-pane -R 2
bind -n M-K resize-pane -U 2
bind -n M-J resize-pane -D 2

# split panes using Ctrl-Alt-<arrowkey> and Ctrl-Alt-<hjkl>
unbind C-M-Left
unbind C-M-Right
unbind C-M-Up
unbind C-M-Down

bind -n C-M-Left split-window -bh -c "#{pane_current_path}"
bind -n C-M-Right split-window -h -c "#{pane_current_path}"
bind -n C-M-Up split-window -b -c "#{pane_current_path}"
bind -n C-M-Down split-window -c "#{pane_current_path}"

unbind C-M-h
unbind C-M-l
unbind C-M-k
unbind C-M-j

bind -n C-M-h split-window -bh -c "#{pane_current_path}"
bind -n C-M-l split-window -h -c "#{pane_current_path}"
bind -n C-M-k split-window -b -c "#{pane_current_path}"
bind -n C-M-j split-window -c "#{pane_current_path}"

# switch panes using Alt-<arrowkey> and Alt-<hjkl> without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-j select-pane -U
bind -n M-k select-pane -D

# rose pine moon colour theme

clr_base="#232136"
clr_surface="#2a273f"
clr_overlay="#393552"
clr_muted="#6e6a86"
clr_subtle="#908caa"
clr_highlight_low="#2a283e"
clr_highlight_med="#44415a"
clr_highlight_high="#56526e"
clr_text="#e0def4"
clr_love="#eb6f92"
clr_gold="#f6c177"
clr_rose="#ea9a97"
clr_pine="#3e8fb0"
clr_foam="#9ccfd8"
clr_iris="#c4a7e7"

status_bg="$clr_surface"
status_bg_secondary="$clr_overlay"
status_bg_tertiary="$clr_highlight_high"
status_active_window_bg="$clr_rose"
status_text_normal="$clr_text"
status_text_alt="$clr_rose"

#   │  

# mouse mode: click-drag selects/scrolls within the current pane only
set -g mouse on

# don't let tmux push selections to host clipboard via OSC52 automatically
set -g set-clipboard off

# drag-select highlights and stays in copy-mode; no auto-copy, no exit.
# mode-keys defaults to emacs, so "copy-mode" (not "copy-mode-vi") is the
# table actually used -- bind both so this holds regardless of mode-keys.
# A plain click (e.g. the click that refocuses the window from another
# host app) can still be reported as a zero-length drag, which would enter
# copy-mode with an empty selection and get stuck there. Only keep
# copy-mode open when the drag actually moved to a different cell
# (selection_start_x/y != selection_end_x/y); otherwise cancel back to the
# normal pane.
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode MouseDragEnd1Pane if -F "#{||:#{!=:#{selection_start_x},#{selection_end_x}},#{!=:#{selection_start_y},#{selection_end_y}}}" "send -X copy-selection-no-clear" "send -X cancel"
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane if -F "#{||:#{!=:#{selection_start_x},#{selection_end_x}},#{!=:#{selection_start_y},#{selection_end_y}}}" "send -X copy-selection-no-clear" "send -X cancel"

# explicit copy/paste keybinds: Ctrl+Insert copy, Shift+Insert paste (WSL)
# C-Insert must be bound in the copy-mode tables themselves: while a
# drag-selection holds the pane in copy-mode, key lookup uses that table
# exclusively, so a root (-n) binding never fires. copy-pipe-and-cancel
# both sends the selection to the Windows clipboard and exits copy-mode,
# clearing the highlight -- the "manual copy" the drag-select is waiting for.
# Prefer win32yank.exe; when it cannot run (e.g. Windows blocks unsigned
# executables) fall back to the built-in clip.exe and Get-Clipboard. The
# probe runs each time this file is sourced.
if-shell "~/.local/bin/win32yank.exe -o >/dev/null 2>&1" {
  bind -T copy-mode C-Insert send -X copy-pipe-and-cancel "~/.local/bin/win32yank.exe -i --crlf"
  bind -T copy-mode-vi C-Insert send -X copy-pipe-and-cancel "~/.local/bin/win32yank.exe -i --crlf"
  bind -n S-Insert run-shell -b "~/.local/bin/win32yank.exe -o --lf | tmux load-buffer -w -"
} {
  bind -T copy-mode C-Insert send -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
  bind -T copy-mode-vi C-Insert send -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
  bind -n S-Insert run-shell -b "/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command Get-Clipboard -Raw | tr -d '\\r' | tmux load-buffer -w -"
}

# statusbar
set -g status-interval 5
set -g default-terminal "screen-256color"
set -g status-bg "$status_bg"
set -g status-fg "$status_text_normal"


# windows

set -g status-left ""
set-window-option -g window-status-separator ""

set-window-option -g window-status-format " #I #W "

# format active tmux windows
set-window-option -g window-status-current-format "#[fg=$status_bg,bg=$status_active_window_bg]#[fg=status_bg,bg=$status_active_window_bg] #I #W #[fg=$status_active_window_bg,bg=$status_bg]"

# right statusbar

right_status_bg="$status_bg_secondary"
right_status_bg_alt="$status_bg_tertiary"
right_status_username_text="$status_text_normal"
right_status_time_text="$status_text_normal"
right_status_date_text="$status_text_normal"

set -g status-right "#[fg=$right_status_bg,bg=$status_bg]#[fg=$right_status_username_text,bg=$right_status_bg] #S #[fg=$right_status_bg_alt,bg=$right_status_bg]#[fg=$right_status_time_text,bg=$right_status_bg_alt] %H:%M - #[fg=$right_status_date_text,bg=$right_status_bg_alt]%D "

# List of plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "noscript/tmux-mighty-scroll"
# claude fullscreen TUI (process comm "claude"): pass wheel events to it
set -g @mighty-scroll-pass-through 'vim claude'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"
